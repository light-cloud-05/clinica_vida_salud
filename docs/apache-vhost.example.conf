# Ejemplo para revisión manual. No se instala automáticamente.
# Elegir un puerto libre; no añadir Listen si ya está declarado.
Listen 8080
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot "D:/Proyectos/clinica_vida_salud/public"
    <Directory "D:/Proyectos/clinica_vida_salud">
        AllowOverride None
        Require all denied
    </Directory>
    <Directory "D:/Proyectos/clinica_vida_salud/public">
        Options -Indexes -MultiViews
        AllowOverride FileInfo Indexes Options
        Require local
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
